# 单域名微前端生产配置。所有应用由同一个 443 端口提供，浏览器侧不存在跨域。
# 部署脚本通过 current 软链切换版本，因此发布时无需 reload Nginx。
server {
    listen 80;
    server_name platform.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name platform.example.com;

    ssl_certificate     /etc/nginx/certs/platform.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/platform.example.com.key;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # remote entry 的文件名固定，不能长期缓存，否则 shell 可能加载到旧版本入口。
    location = /product-center/remoteProductCenter.js {
        alias /srv/central-platform/prod/product-center/current/remoteProductCenter.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /protocol-center/remoteProtocolCenter.js {
        alias /srv/central-platform/prod/protocol-center/current/remoteProtocolCenter.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /payment-center/remotePaymentCenter.js {
        alias /srv/central-platform/prod/payment-center/current/remotePaymentCenter.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /user-center/remoteUserCenter.js {
        alias /srv/central-platform/prod/user-center/current/remoteUserCenter.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # standalone index 同样不缓存；带 hash 的 JS/CSS 和 PDF worker 由下方目录规则长期缓存。
    location = /product-center/index.html {
        alias /srv/central-platform/prod/product-center/current/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /protocol-center/index.html {
        alias /srv/central-platform/prod/protocol-center/current/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /payment-center/index.html {
        alias /srv/central-platform/prod/payment-center/current/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /user-center/index.html {
        alias /srv/central-platform/prod/user-center/current/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /product-center  { return 301 /product-center/; }
    location = /protocol-center { return 301 /protocol-center/; }
    location = /payment-center  { return 301 /payment-center/; }
    location = /user-center     { return 301 /user-center/; }

    # 仅 Vite 生成的 hash 资源使用长期缓存。
    location ^~ /product-center/assets/ {
        alias /srv/central-platform/prod/product-center/current/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /protocol-center/assets/ {
        alias /srv/central-platform/prod/protocol-center/current/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /payment-center/assets/ {
        alias /srv/central-platform/prod/payment-center/current/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /user-center/assets/ {
        alias /srv/central-platform/prod/user-center/current/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # public 目录中的 PDF、图标等文件名可能不带 hash，切换版本后要求浏览器重新校验。
    location ^~ /product-center/ {
        alias /srv/central-platform/prod/product-center/current/;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /protocol-center/ {
        alias /srv/central-platform/prod/protocol-center/current/;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /payment-center/ {
        alias /srv/central-platform/prod/payment-center/current/;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /user-center/ {
        alias /srv/central-platform/prod/user-center/current/;
        add_header Cache-Control "no-cache" always;
    }

    # shell 的 hash 静态资源长期缓存，index 和业务路由始终回源到最新 shell。
    location ^~ /assets/ {
        alias /srv/central-platform/prod/shell-app/current/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        root /srv/central-platform/prod/shell-app/current;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        root /srv/central-platform/prod/shell-app/current;
        try_files $uri $uri/ /index.html;
    }
}
